<div id="car-explosion-large-preview">
  <style>
    #car-explosion-large-preview { width: 100%; }
    #car-explosion-large-preview .clock-view { display: block; width: 100%; max-width: 560px; height: auto; margin: 0 auto; background: #101410; border-radius: 8px; touch-action: manipulation; cursor: pointer; }
    #car-explosion-large-preview .playback { display: flex; justify-content: center; align-items: center; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
    #car-explosion-large-preview .phase { min-width: 130px; text-align: center; color: var(--foreground); }
  </style>
  <canvas class="clock-view" width="480" height="320" role="img" aria-label="Car clock larger explosion preview. The explosion is twice as wide and tall, with a larger fire burst, sparks and smoke, followed by the damaged car driving away and its replacement arriving.">Car explosion animation preview.</canvas>
  <div class="playback">
    <button type="button" class="btn btn-primary" data-action="replay">Replay</button>
    <button type="button" class="btn" data-action="slow">Slow replay</button>
    <span class="phase text-small" role="status" aria-live="polite">Ready</span>
  </div>
  <script>
  (() => {
    const root = document.getElementById('car-explosion-large-preview');
    const canvas = root.querySelector('canvas');
    const ctx = canvas.getContext('2d');
    const phase = root.querySelector('.phase');
    const normal = new Image(), crushed = new Image();
    const W = 480, H = 320, PI = Math.PI, TAU = 2 * PI;
    const masks = [63, 6, 91, 79, 102, 109, 125, 7, 127, 111];
    const digits = [1, 2, 4, 8];
    const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
    function nearest(a, b) {
      const delta = c => Math.abs(((c - a + PI) % TAU + TAU) % TAU - PI);
      return delta(b) <= delta(b + PI) ? b : b + PI;
    }

    // These six small surfaces are the proposed frames, reused for every hit.
    // All growth, smoke and sparks are baked here; playback only selects a frame.
    function explosionFrame(frame) {
      const tile = document.createElement('canvas'); tile.width = tile.height = 128;
      const g = tile.getContext('2d');
      g.translate(64, 64);
      g.scale(2, 2);
      function disc(x, y, radius, stops) {
        const gradient = g.createRadialGradient(x, y, 0, x, y, radius);
        for (const [at, color] of stops) gradient.addColorStop(at, color);
        g.fillStyle = gradient; g.beginPath(); g.arc(x, y, radius, 0, TAU); g.fill();
      }
      const radii = [9, 16, 20, 22, 23, 25];
      const r = radii[frame];
      if (frame >= 2) {
        const opacity = [0, 0, 0.36, 0.53, 0.32, 0.12][frame];
        for (let i = 0; i < 7; ++i) {
          const a = i * TAU / 7 + 0.27;
          const distance = r * (0.50 + 0.10 * Math.sin(i * 2.3));
          const x = Math.cos(a) * distance, y = Math.sin(a) * distance - (frame - 2) * 1.5;
          disc(x, y, 8 + frame * 0.7 + Math.sin(i * 1.7), [
            [0, `rgba(159,151,136,${opacity})`],
            [0.50, `rgba(102,102,93,${opacity * 0.87})`],
            [1, 'rgba(64,68,61,0)']
          ]);
        }
      }
      if (frame < 4) {
        const strength = [0.8, 1, 0.85, 0.42][frame];
        disc(0, 0, r + 8, [[0, `rgba(255,160,24,${strength * 0.50})`], [1, 'rgba(247,62,2,0)']]);
        for (let i = 0; i < 9; ++i) {
          const a = i * TAU / 9 + 0.15;
          const d = r * (0.48 + 0.08 * Math.sin(i * 2));
          const size = r * (0.37 + 0.05 * Math.cos(i * 3));
          disc(Math.cos(a) * d, Math.sin(a) * d, size, [
            [0, `rgba(255,225,102,${strength})`],
            [0.42, `rgba(255,141,18,${strength})`],
            [0.80, `rgba(237,62,4,${strength * 0.75})`],
            [1, 'rgba(185,34,0,0)']
          ]);
        }
        disc(0, 0, r * 0.62, [
          [0, `rgba(255,255,231,${strength})`],
          [0.42, `rgba(255,239,148,${strength})`],
          [0.80, `rgba(255,188,41,${strength * 0.90})`],
          [1, 'rgba(255,123,0,0)']
        ]);
      }
      if (frame < 5) {
        const opacity = [0.8, 1, 0.9, 0.7, 0.24][frame];
        g.lineCap = 'round';
        for (let i = 0; i < 10; ++i) {
          const a = i * TAU / 10 + 0.13 + 0.08 * Math.sin(i * 1.9);
          const distance = 9 + frame * 4.2 + (i % 3) * 1.5;
          const tail = distance - (frame < 3 ? 4.5 : 2.3);
          g.strokeStyle = `rgba(255,${i % 3 === 0 ? 152 : 215},${i % 3 === 0 ? 25 : 100},${opacity})`;
          g.lineWidth = frame < 3 ? 1.2 : 0.85;
          g.beginPath(); g.moveTo(Math.cos(a) * tail, Math.sin(a) * tail);
          g.lineTo(Math.cos(a) * distance, Math.sin(a) * distance); g.stroke();
        }
      }
      if (frame === 0) disc(0, 0, 8, [[0, 'rgba(255,255,244,1)'], [0.50, 'rgba(255,249,203,0.95)'], [1, 'rgba(255,209,90,0)']]);
      return tile;
    }
    const explosion = Array.from({length: 6}, (_, i) => explosionFrame(i));

    class Car {
      constructor(target, slot, segment, scale = 1.05, colon = false) {
        Object.assign(this, {target, slot, segment, scale, colon});
        this.x = target.x; this.y = target.y;
        this.angle = colon ? target.angle : ([1, 5].includes(segment) ? PI : target.angle);
        this.active = colon || !!(masks[digits[slot]] & (1 << segment));
        this.phase = 'parked'; this.crushedAt = -10000; this.light = false;
        this.atTarget = this.active;
        const digit = digits[slot];
        this.light = !colon && (digit === 1 && [1, 2].includes(segment) || digit === 4 && [1, 2, 5].includes(segment));
      }
      squash(now) {
        if (!this.active || this.phase === 'squashing' || this.phase === 'departing') return false;
        this.crushedAt = now; this.phase = 'squashing'; this.atTarget = false;
        this.impact = {x: this.x, y: this.y};
        const bx = -Math.sin(this.angle), by = Math.cos(this.angle);
        let distance = 10000;
        if (Math.abs(bx) > 0.001) distance = Math.min(distance, ((bx > 0 ? W + 60 : -60) - this.target.x) / bx);
        if (Math.abs(by) > 0.001) distance = Math.min(distance, ((by > 0 ? H + 60 : -60) - this.target.y) / by);
        this.entry = {x: this.target.x + bx * distance, y: this.target.y + by * distance};
        return true;
      }
      damaged() { return this.phase === 'squashing' || this.phase === 'departing'; }
      moving() { return this.active && !this.atTarget && this.phase !== 'squashing'; }
      update(dt, now) {
        if (!this.active) return;
        if (this.phase === 'squashing') {
          if (now - this.crushedAt < 720) return;
          this.phase = 'departing';
        }
        if (this.phase === 'departing') {
          const speed = Math.min(220, 65 + (now - this.crushedAt - 720) * 0.22);
          this.x += Math.sin(this.angle) * speed * dt;
          this.y -= Math.cos(this.angle) * speed * dt;
          if (this.x >= -60 && this.x <= W + 60 && this.y >= -60 && this.y <= H + 60) return;
          this.phase = 'replacing'; this.x = this.entry.x; this.y = this.entry.y;
          return;
        }
        const dx = this.target.x - this.x, dy = this.target.y - this.y, distance = Math.hypot(dx, dy);
        if (distance < 1.6) {
          this.x = this.target.x; this.y = this.target.y; this.atTarget = true; this.phase = 'parked';
          this.angle = nearest(this.angle, this.target.angle); return;
        }
        this.atTarget = false;
        let speed = Math.min(155, Math.max(24, distance * 3.4));
        if (distance < 26) speed = Math.max(8, distance * 3.2);
        const step = Math.min(distance, speed * dt);
        this.x += dx / distance * step; this.y += dy / distance * step;
        this.angle = Math.atan2(dy, dx) + PI / 2;
        if (Math.hypot(this.target.x - this.x, this.target.y - this.y) < 24) this.angle = nearest(this.angle, this.target.angle);
      }
      hit(x, y) {
        if (!this.active || this.damaged()) return -1;
        const dx = x - this.x, dy = y - this.y;
        const lx = Math.cos(this.angle) * dx + Math.sin(this.angle) * dy;
        const ly = -Math.sin(this.angle) * dx + Math.cos(this.angle) * dy;
        return Math.abs(lx) <= 14 * this.scale + 4 && Math.abs(ly) <= 26 * this.scale + 4 ? dx * dx + dy * dy : -1;
      }
      drawLights() {
        if (!this.active || !this.atTarget || !this.light || this.damaged()) return;
        ctx.save(); ctx.translate(this.x, this.y); ctx.rotate(this.angle); ctx.scale(this.scale, this.scale);
        for (const x of [-5.6, 5.6]) {
          const grad = ctx.createLinearGradient(x, 22.88, x, 53.04);
          grad.addColorStop(0, 'rgba(230,35,30,0.56)'); grad.addColorStop(0.35, 'rgba(230,35,30,0.24)'); grad.addColorStop(1, 'rgba(230,35,30,0)');
          ctx.fillStyle = grad; ctx.beginPath(); ctx.moveTo(x - 2, 22.88); ctx.lineTo(x + 2, 22.88);
          ctx.lineTo(x + 6.2, 53.04); ctx.lineTo(x - 6.2, 53.04); ctx.closePath(); ctx.fill();
        }
        ctx.restore();
      }
      draw(now) {
        if (!this.active) return;
        const age = now - this.crushedAt;
        const damage = this.damaged() && age >= 90;
        const pulse = this.phase === 'squashing' && age < 180 ? Math.sin(PI * age / 180) : 0;
        ctx.save(); ctx.translate(this.x, this.y); ctx.rotate(this.angle);
        ctx.scale(this.scale * (1 + 0.14 * pulse), this.scale * (1 - 0.32 * pulse));
        if (this.colon && !damage) ctx.filter = 'hue-rotate(-28deg) saturate(1.5)';
        ctx.drawImage(damage ? crushed : normal, -14, -26, 28, 52); ctx.restore();
      }
      drawExplosion(now) {
        const age = now - this.crushedAt - 90;
        if (!this.impact || age < 0 || age >= 350) return;
        const frame = Math.min(5, Math.floor(age * 6 / 350));
        const size = this.colon ? 72 : 128;
        ctx.drawImage(explosion[frame], this.impact.x - size / 2, this.impact.y - size / 2, size, size);
      }
    }

    let cars = [], selected, now = 10000, rate = 1, running = false, lastWall = 0, accumulated = 0;
    let ready = false, autoplay;
    function reset() {
      cars = []; now = 10000;
      for (let slot = 0; slot < 4; ++slot) {
        const x = [30, 124, 296, 390][slot], center = x + 30, right = x + 60;
        const upper = 120, middle = 167, lower = 214;
        const top = 73, bottom = 261, longHalf = 27.3, shortHalf = 14.7;
        const angle = slot === 0 || slot === 2 ? PI / 2 : -PI / 2;
        const targets = [
          {x: center, y: top + shortHalf - 2, angle},
          {x: right, y: upper, angle: 0},
          {x: right, y: lower - longHalf, angle: 0},
          {x: center, y: bottom - shortHalf * 2.5, angle},
          {x, y: lower - longHalf, angle: 0},
          {x, y: upper, angle: 0},
          {x: center, y: middle - shortHalf, angle}
        ];
        targets.forEach((target, i) => cars.push(new Car(target, slot, i)));
      }
      cars.push(new Car({x: 240, y: 138, angle: 0}, 0, 0, 0.56, true));
      cars.push(new Car({x: 240, y: 178, angle: PI}, 0, 0, 0.56, true));
      selected = cars[2 * 7 + 1];
    }
    function yielding() {
      const visible = cars.filter(c => c.active && !c.colon);
      for (let i = 0; i < visible.length; ++i) for (let j = i + 1; j < visible.length; ++j) {
        const a = visible[i], b = visible[j];
        if (a.damaged() && b.damaged()) continue;
        const am = a.moving(), bm = b.moving();
        if (!am && !bm) continue;
        const dx = b.x - a.x, dy = b.y - a.y, d = Math.hypot(dx, dy);
        if (d < 0.001 || d >= 28) continue;
        const push = (28 - d) * 0.5;
        function move(car, factor) {
          if (car.damaged()) return;
          car.x += dx / d * push * factor; car.y += dy / d * push * factor; car.atTarget = false;
        }
        if (am && !bm) move(b, 1.7);
        else if (!am && bm) move(a, -1.7);
        else { move(a, -0.35); move(b, 0.35); }
      }
    }
    function background() {
      ctx.fillStyle = '#101410'; ctx.fillRect(0, 0, W, H);
      ctx.fillStyle = '#292d29'; ctx.fillRect(0, 38, W, 1); ctx.fillRect(0, 281, W, 1);
      ctx.fillStyle = '#181c18'; for (const x of [102, 196, 284, 378]) ctx.fillRect(x, 0, 1, H);
      ctx.fillStyle = '#393d29'; for (let x = 7; x < W; x += 28) { ctx.fillRect(x, 26, 11, 1); ctx.fillRect(x, 293, 11, 1); }
    }
    function label(text) { if (phase.textContent !== text) phase.textContent = text; }
    function draw() {
      background();
      for (const car of cars) car.drawLights();
      for (const car of cars) car.draw(now);
      for (const car of cars) car.drawExplosion(now);
      if (!selected || selected.crushedAt < 0) return;
      const age = now - selected.crushedAt;
      if (selected.phase === 'squashing') label(age < 90 ? 'Squash' : age < 200 ? 'Flash + sparks' : age < 325 ? 'Explosion' : age < 440 ? 'Smoke fades' : 'Damaged car');
      else if (selected.phase === 'departing') label('Driving away');
      else if (selected.phase === 'replacing') label('Replacement arriving');
      else if (selected.crushedAt > 0) label('Replacement parked');
    }
    function tick(wall) {
      if (!root.isConnected || !running) { running = false; return; }
      accumulated += Math.min(100, wall - lastWall); lastWall = wall;
      const interval = 1000 / 17;
      if (accumulated >= interval) {
        const completed = Math.floor(accumulated / interval) * interval;
        const elapsed = completed * rate; accumulated -= completed;
        now += elapsed;
        for (const car of cars) car.update(Math.min(elapsed / 1000, 0.05), now);
        yielding(); draw();
        if (!cars.some(car => car.active && (car.damaged() || !car.atTarget))) running = false;
      }
      if (running) requestAnimationFrame(tick);
    }
    function start() {
      if (running) return;
      running = true; lastWall = performance.now(); accumulated = 0; requestAnimationFrame(tick);
    }
    function replay(speed) {
      if (!ready) return;
      clearTimeout(autoplay); rate = speed; reset(); selected.squash(now); draw(); start();
    }
    root.querySelector('[data-action="replay"]').addEventListener('click', () => replay(1));
    root.querySelector('[data-action="slow"]').addEventListener('click', () => replay(0.3));
    canvas.addEventListener('pointerdown', event => {
      if (!ready) return;
      clearTimeout(autoplay);
      const bounds = canvas.getBoundingClientRect();
      const x = (event.clientX - bounds.left) * W / bounds.width, y = (event.clientY - bounds.top) * H / bounds.height;
      let best = null, score = Infinity;
      for (const car of cars) { const hit = car.hit(x, y); if (hit >= 0 && hit < score) { best = car; score = hit; } }
      if (best && best.squash(now)) { rate = 1; selected = best; start(); }
    });
    function loaded() {
      if (!normal.complete || !normal.naturalWidth || !crushed.complete || !crushed.naturalWidth) return;
      ready = true; reset(); draw(); label('Tap any car');
      if (!matchMedia('(prefers-reduced-motion: reduce)').matches) autoplay = setTimeout(() => { if (root.isConnected) replay(1); }, 800);
    }
    normal.onload = crushed.onload = loaded;
